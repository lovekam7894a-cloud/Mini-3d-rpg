<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fantasy World Online</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
.panel{position:fixed;background:#101827dd;border:1px solid #ffffff30;border-radius:12px;padding:10px;backdrop-filter:blur(6px);z-index:2}
#status{top:10px;left:10px;min-width:190px;font-size:13px}
#help{top:10px;right:10px;max-width:165px;font-size:12px;line-height:1.5}
#actions{bottom:18px;right:14px;display:flex;gap:10px;align-items:end}
button{border:1px solid #ffffff55;background:#263b5b;color:white;border-radius:12px;padding:13px 16px;font-weight:700;font-size:14px}
button:active{background:#496a98;transform:scale(.97)}
#move{position:fixed;bottom:18px;left:14px;z-index:3;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}
#move button{padding:0;font-size:20px;opacity:.9}
#move .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#message{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:#101827dd;border-radius:12px;padding:12px 18px;z-index:4;text-align:center;display:none}
#inventory{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;font-size:12px;background:#101827cc;padding:7px 10px;border-radius:9px;max-width:38vw}
.bar{height:7px;background:#ffffff30;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#45d483;width:0%}
@media(max-width:600px){#help{top:auto;bottom:145px;right:10px;max-width:145px}#status{font-size:12px;min-width:165px}#inventory{bottom:118px;max-width:45vw}}
</style>
</head>
<body>
<div id="game"></div>
<div id="status" class="panel">
  <b>⚔️ Fantasy World Online</b><br>
  นักผจญภัย: ผู้กล้า<br>
  เลเวล <span id="level">1</span> · EXP <span id="xp">0</span>/<span id="need">50</span>
  <div class="bar"><div id="xpbar" class="fill"></div></div>
  ❤️ HP: <span id="hp">100</span>/100<br>
  🪙 เหรียญ: <span id="coins">0</span>
</div>
<div id="help" class="panel">🌲 <b>ป่าฝึกหัด</b><br>แตะปุ่มลูกศรเพื่อเดิน<br>เข้าใกล้มอนสเตอร์แล้วกดโจมตี<br><small>เดโมเวอร์ชัน 0.1 — เล่นคนเดียวในเครื่อง</small></div>
<div id="inventory" class="panel">🎒 กระเป๋า: <span id="items">ยังไม่มีไอเทม</span></div>
<div id="move">
 <button class="up" data-dir="up">▲</button>
 <button class="left" data-dir="left">◀</button>
 <button class="down" data-dir="down">▼</button>
 <button class="right" data-dir="right">▶</button>
</div>
<div id="actions" class="panel">
 <button id="attack">⚔️ โจมตี</button>
</div>
<div id="message"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7df);scene.fog=new THREE.Fog(0x9bc7df,22,65);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,8,12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x587047,2));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,12,8);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x5d984c}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
const grid=new THREE.GridHelper(100,50,0x47783d,0x659b53);grid.position.y=-.06;scene.add(grid);
function tree(x,z){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.2,7),new THREE.MeshStandardMaterial({color:0x68452d}));trunk.position.set(x,.55,z);scene.add(trunk);const top=new THREE.Mesh(new THREE.ConeGeometry(.9,2.1,7),new THREE.MeshStandardMaterial({color:0x236b43}));top.position.set(x,2,z);scene.add(top)}
for(let i=0;i<42;i++){let x=(Math.random()-.5)*42,z=(Math.random()-.5)*42;if(Math.abs(x)>3||Math.abs(z)>3)tree(x,z)}
function makeHero(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,8),new THREE.MeshStandardMaterial({color:0x3267bd}));body.position.y=.85;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:0xf0c49b}));head.position.y=1.55;g.add(head);const sword=new THREE.Mesh(new THREE.BoxGeometry(.12,.9,.12),new THREE.MeshStandardMaterial({color:0xd9e5ef,metalness:.7,roughness:.25}));sword.position.set(.48,.95,0);sword.rotation.z=-.35;g.add(sword);scene.add(g);return g}
const hero=makeHero();hero.position.set(0,0,0);
const monsters=[];
function spawnMonster(x,z){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x65a83e});const b=new THREE.Mesh(new THREE.SphereGeometry(.55,12,10),mat);b.position.y=.55;g.add(b);const eyeMat=new THREE.MeshStandardMaterial({color:0x171717});for(const ex of [-.2,.2]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),eyeMat);e.position.set(ex,.68,.46);g.add(e)}g.position.set(x,0,z);scene.add(g);monsters.push({mesh:g,hp:30,max:30,alive:true})}
for(let i=0;i<8;i++)spawnMonster((Math.random()-.5)*22,(Math.random()-.5)*22);
let level=1,xp=0,need=50,hp=100,coins=0,items=[];let move={x:0,z:0};let messageTimer;
function say(t){const el=document.querySelector('#message');el.textContent=t;el.style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(()=>el.style.display='none',1600)}
function updateUI(){document.querySelector('#level').textContent=level;document.querySelector('#xp').textContent=xp;document.querySelector('#need').textContent=need;document.querySelector('#xpbar').style.width=(xp/need*100)+'%';document.querySelector('#hp').textContent=hp;document.querySelector('#coins').textContent=coins;document.querySelector('#items').textContent=items.length?items.join(', '):'ยังไม่มีไอเทม'}
function award(){xp+=20;coins+=5;if(Math.random()<.45)items.push('สมุนไพร');while(xp>=need){xp-=need;level++;need=Math.round(need*1.35);hp=100;say('🎉 เลเวลอัป! ตอนนี้เลเวล '+level)}updateUI()}
function attack(){let target=null,dist=2.5;for(const m of monsters){if(!m.alive)continue;const d=hero.position.distanceTo(m.mesh.position);if(d<dist){dist=d;target=m}}if(!target){say('เข้าใกล้มอนสเตอร์ก่อน!');return}target.hp-=15;target.mesh.scale.setScalar(Math.max(.35,target.hp/30));if(target.hp<=0){target.alive=false;scene.remove(target.mesh);award();say('ชนะมอนสเตอร์! +20 EXP +5 เหรียญ')}else say('โจมตีโดน! มอนสเตอร์เหลือ HP '+target.hp)}
document.querySelector('#attack').addEventListener('click',attack);
document.querySelectorAll('[data-dir]').forEach(b=>{const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};const start=()=>{move.x=dirs[b.dataset.dir][0];move.z=dirs[b.dataset.dir][1]};const stop=()=>{move.x=0;move.z=0};b.addEventListener('pointerdown',e=>{e.preventDefault();start()});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move.z=-1;if(e.key==='ArrowDown'||e.key==='s')move.z=1;if(e.key==='ArrowLeft'||e.key==='a')move.x=-1;if(e.key==='ArrowRight'||e.key==='d')move.x=1;if(e.key===' ')attack()});
addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){move.x=0;move.z=0}});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(move.x||move.z){const v=new THREE.Vector3(move.x,0,move.z).normalize();hero.position.addScaledVector(v,dt*5);hero.rotation.y=Math.atan2(v.x,v.z)}hero.position.x=THREE.MathUtils.clamp(hero.position.x,-24,24);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-24,24);camera.position.lerp(new THREE.Vector3(hero.position.x,hero.position.y+7,hero.position.z+10),.08);camera.lookAt(hero.position.x,hero.position.y+0.7,hero.position.z);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateUI();animate();
</script>
</body>
</html>
